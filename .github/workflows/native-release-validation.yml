name: Native release validation (nonpublishing)

run-name: Native validation of ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact frozen 0.9.0 candidate commit
        required: true
        type: string
      expected_workflow_sha:
        description: Exact reviewed main commit containing this workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-release-validation-${{ github.run_id }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: d58b69c549d4b13e53acab72770266e58d1df1e7
  MATURIN_ACTION_SHA: e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
  RUSTUP_TOOLCHAIN: '1.93.0'

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Validate immutable inputs before candidate checkout
        shell: bash
        env:
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          INPUT_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
          ACTUAL_WORKFLOW_SHA: ${{ github.workflow_sha }}
          ACTUAL_EVENT: ${{ github.event_name }}
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_REPOSITORY: ${{ github.repository }}
          ACTUAL_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          expected = {
              "INPUT_CANDIDATE_SHA": "d58b69c549d4b13e53acab72770266e58d1df1e7",
              "ACTUAL_EVENT": "workflow_dispatch",
              "ACTUAL_REF": "refs/heads/main",
              "ACTUAL_REPOSITORY": "PSU3D0/formualizer",
              "ACTUAL_WORKFLOW_REF": "PSU3D0/formualizer/.github/workflows/native-release-validation.yml@refs/heads/main",
          }
          for name in ("INPUT_CANDIDATE_SHA", "INPUT_WORKFLOW_SHA", "ACTUAL_WORKFLOW_SHA"):
              if re.fullmatch(r"[0-9a-f]{40}", os.environ[name]) is None:
                  raise SystemExit(f"{name} is not a full lowercase commit SHA")
          if os.environ["INPUT_WORKFLOW_SHA"] != os.environ["ACTUAL_WORKFLOW_SHA"]:
              raise SystemExit("unreviewed workflow commit")
          for name, value in expected.items():
              if os.environ[name] != value:
                  raise SystemExit(f"{name} mismatch")
          PY

      - name: Check out reviewed validation driver
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: driver
          persist-credentials: false

      - name: Check out frozen candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false

      - name: Verify event, checkouts, tree, manifests, lock, and recipe
        shell: bash
        env:
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          INPUT_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
          ACTUAL_WORKFLOW_SHA: ${{ github.workflow_sha }}
          ACTUAL_EVENT: ${{ github.event_name }}
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_REPOSITORY: ${{ github.repository }}
          ACTUAL_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: >-
          python3 -I -B driver/scripts/native-wheel-validation.py preflight
          --candidate-sha "$INPUT_CANDIDATE_SHA"
          --workflow-sha "$ACTUAL_WORKFLOW_SHA"
          --expected-workflow-sha "$INPUT_WORKFLOW_SHA"
          --event-name "$ACTUAL_EVENT"
          --ref "$ACTUAL_REF"
          --repository "$ACTUAL_REPOSITORY"
          --workflow-ref "$ACTUAL_WORKFLOW_REF"
          --driver driver --candidate candidate

  build-linux:
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - row: linux-x86_64
            target: x86_64
            resolved_target: x86_64-unknown-linux-gnu
            manylinux: auto
            image: quay.io/pypa/manylinux2014_x86_64:latest
          - row: linux-aarch64
            target: aarch64
            resolved_target: aarch64-unknown-linux-gnu
            manylinux: auto
            image: ghcr.io/rust-cross/manylinux2014-cross:aarch64
          - row: musllinux-x86_64
            target: x86_64
            resolved_target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            image: ghcr.io/rust-cross/rust-musl-cross:x86_64-musl
          - row: musllinux-aarch64
            target: aarch64
            resolved_target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            image: ghcr.io/rust-cross/rust-musl-cross:aarch64-musl
    steps:
      - name: Check out reviewed validation driver
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: driver
          persist-credentials: false

      - name: Check out frozen candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false

      - name: Repeat immutable driver and source verification
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python3 -I -B driver/scripts/native-wheel-validation.py verify-driver --driver driver --workflow-sha "$WORKFLOW_SHA"
          python3 -I -B driver/scripts/native-wheel-validation.py verify-source --candidate candidate

      - name: Set up release build Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.x

      - name: Precreate narrow host-owned build evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate/native-validation-evidence
          test -w candidate/native-validation-evidence
          printf 'runner_image_os=%s\nrunner_image_version=%s\n' "${ImageOS:?}" "${ImageVersion:?}" > candidate/native-validation-evidence/runner.txt

      - name: Build exact release wheel and prove compiler inside container
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1 peeled commit
        env:
          RUSTUP_TOOLCHAIN: '1.93.0'
        with:
          working-directory: candidate
          maturin-version: v1.11.5
          target: ${{ matrix.target }}
          rust-toolchain: 1.93.0
          args: --release --out dist --manifest-path bindings/python/Cargo.toml
          sccache: 'false'
          manylinux: ${{ matrix.manylinux }}
          before-script-linux: >-
            bash ../driver/scripts/native-linux-compiler-proof.sh
            "${{ matrix.row }}" "${{ matrix.resolved_target }}"
            "native-validation-evidence/compiler-${{ matrix.row }}.raw"

      - name: Normalize in-container compiler proof and record builder image
        shell: bash
        env:
          BUILD_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          python3 -I -B driver/scripts/native-wheel-validation.py linux-compiler-proof \
            --candidate candidate --raw candidate/native-validation-evidence/compiler-${{ matrix.row }}.raw \
            --row "${{ matrix.row }}" --runner-os "${{ runner.os }}" --runner-arch "${{ runner.arch }}" \
            --runner-image-os "${ImageOS:?}" --runner-image-version "${ImageVersion:?}" \
            --output candidate/native-validation-evidence/compiler-${{ matrix.row }}.json
          {
            cat candidate/native-validation-evidence/runner.txt
            printf 'selected_build_image=%s\n' "$BUILD_IMAGE"
            docker image inspect --format 'repo_digests={{json .RepoDigests}} image_id={{.Id}}' "$BUILD_IMAGE"
          } > candidate/native-validation-evidence/builder-${{ matrix.row }}.txt
          rm candidate/native-validation-evidence/runner.txt
          python3 -I -B driver/scripts/native-wheel-validation.py verify-source --candidate candidate

      - name: Audit raw wheel before transfer
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUNNER_IMAGE_LABEL: ${{ runner.os }}-${{ runner.arch }}-${{ runner.name }}
          RUN_ID_VALUE: ${{ github.run_id }}
          RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: >-
          python3 -I -B driver/scripts/native-wheel-validation.py audit-wheel
          --wheelhouse candidate/dist --candidate candidate --row "${{ matrix.row }}"
          --compiler-evidence candidate/native-validation-evidence/compiler-${{ matrix.row }}.json
          --workflow-sha "$WORKFLOW_SHA" --action-commit "$MATURIN_ACTION_SHA"
          --runner-image "$RUNNER_IMAGE_LABEL" --runner-arch "${{ runner.arch }}"
          --run-id "$RUN_ID_VALUE" --run-attempt "$RUN_ATTEMPT_VALUE"
          --native-output candidate/native-validation-evidence/native-extension.bin
          --output candidate/native-validation-evidence/build-${{ matrix.row }}.json

      - name: Inspect ELF headers and dynamic dependencies
        shell: bash
        run: |
          set -euo pipefail
          file candidate/native-validation-evidence/native-extension.bin | tee candidate/native-validation-evidence/native-inspection-${{ matrix.row }}.txt
          readelf -h -d candidate/native-validation-evidence/native-extension.bin | tee -a candidate/native-validation-evidence/native-inspection-${{ matrix.row }}.txt
          rm candidate/native-validation-evidence/native-extension.bin

      - name: Upload audited raw wheel
        id: wheel-upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-validation-wheel-${{ matrix.row }}-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: candidate/dist/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Finalize hashed build evidence and narrowly capture upload outputs
        run: >-
          python3 -I -B driver/scripts/native-wheel-validation.py finalize-build
          --report candidate/native-validation-evidence/build-${{ matrix.row }}.json
          --artifact-id "${{ steps.wheel-upload.outputs.artifact-id }}"
          --artifact-digest "${{ steps.wheel-upload.outputs.artifact-digest }}"
          --compiler candidate/native-validation-evidence/compiler-${{ matrix.row }}.json
          --native-inspection candidate/native-validation-evidence/native-inspection-${{ matrix.row }}.txt
          --builder candidate/native-validation-evidence/builder-${{ matrix.row }}.txt

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-validation-evidence-build-${{ matrix.row }}-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: candidate/native-validation-evidence/*
          if-no-files-found: error
          retention-days: 7

  build-host:
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - row: windows-x64
            runner: windows-latest
            target: x64
            resolved_target: x86_64-pc-windows-msvc
            python: '3.13'
          - row: macos-x86_64
            runner: macos-latest
            target: x86_64
            resolved_target: x86_64-apple-darwin
            python: 3.x
          - row: macos-aarch64
            runner: macos-latest
            target: aarch64
            resolved_target: aarch64-apple-darwin
            python: 3.x
    steps:
      - name: Check out reviewed validation driver
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: driver
          persist-credentials: false

      - name: Check out frozen candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false

      - name: Set up exact release build Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Verify driver and source, then provision exact host compiler
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          python3 -I -B driver/scripts/native-wheel-validation.py verify-driver --driver driver --workflow-sha "$WORKFLOW_SHA"
          python3 -I -B driver/scripts/native-wheel-validation.py verify-source --candidate candidate
          rustup toolchain install 1.93.0 --profile minimal --no-self-update
          test "$(rustc --version)" = "rustc 1.93.0 (254b59607 2026-01-19)"
          rustc -vV
          cargo -V
          rustup show active-toolchain
          rustup which rustc
          mkdir -p candidate/native-validation-evidence
          test -w candidate/native-validation-evidence

      - name: Build exact release wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1 peeled commit
        env:
          RUSTUP_TOOLCHAIN: '1.93.0'
        with:
          working-directory: candidate
          maturin-version: v1.11.5
          target: ${{ matrix.target }}
          rust-toolchain: 1.93.0
          args: --release --out dist --manifest-path bindings/python/Cargo.toml
          sccache: 'false'

      - name: Prove effective host compiler after build and verify clean source
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B driver/scripts/native-wheel-validation.py compiler-proof \
            --candidate candidate --row "${{ matrix.row }}" --target "${{ matrix.resolved_target }}" \
            --runner-os "${{ runner.os }}" --runner-arch "${{ runner.arch }}" \
            --runner-image-os "${ImageOS:?}" --runner-image-version "${ImageVersion:?}" \
            --output candidate/native-validation-evidence/compiler-${{ matrix.row }}.json
          python3 -I -B driver/scripts/native-wheel-validation.py verify-source --candidate candidate
          {
            printf 'runner_image_os=%s\nrunner_image_version=%s\n' "${ImageOS:?}" "${ImageVersion:?}"
            uname -a
            rustc --print cfg --target "${{ matrix.resolved_target }}"
            xcodebuild -version 2>/dev/null || test "${{ matrix.row }}" = windows-x64
          } > candidate/native-validation-evidence/builder-${{ matrix.row }}.txt 2>&1

      - name: Audit raw wheel before transfer
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUNNER_IMAGE_LABEL: ${{ runner.os }}-${{ runner.arch }}-${{ runner.name }}
          RUN_ID_VALUE: ${{ github.run_id }}
          RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: >-
          python3 -I -B driver/scripts/native-wheel-validation.py audit-wheel
          --wheelhouse candidate/dist --candidate candidate --row "${{ matrix.row }}"
          --compiler-evidence candidate/native-validation-evidence/compiler-${{ matrix.row }}.json
          --workflow-sha "$WORKFLOW_SHA" --action-commit "$MATURIN_ACTION_SHA"
          --runner-image "$RUNNER_IMAGE_LABEL" --runner-arch "${{ runner.arch }}"
          --run-id "$RUN_ID_VALUE" --run-attempt "$RUN_ATTEMPT_VALUE"
          --native-output candidate/native-validation-evidence/native-extension.bin
          --output candidate/native-validation-evidence/build-${{ matrix.row }}.json

      - name: Inspect native headers and dependencies
        shell: bash
        run: |
          set -euo pipefail
          native=candidate/native-validation-evidence/native-extension.bin
          case "${{ matrix.row }}" in
            windows-x64)
              command -v llvm-readobj
              llvm-readobj --file-headers --coff-imports "$native" | tee candidate/native-validation-evidence/native-inspection-${{ matrix.row }}.txt
              ;;
            macos-*)
              lipo -archs "$native" | tee candidate/native-validation-evidence/native-inspection-${{ matrix.row }}.txt
              otool -L "$native" | tee -a candidate/native-validation-evidence/native-inspection-${{ matrix.row }}.txt
              ;;
            *) exit 1 ;;
          esac
          rm "$native"

      - name: Upload audited raw wheel
        id: wheel-upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-validation-wheel-${{ matrix.row }}-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: candidate/dist/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Finalize hashed build evidence and narrowly capture upload outputs
        shell: bash
        run: >-
          python3 -I -B driver/scripts/native-wheel-validation.py finalize-build
          --report candidate/native-validation-evidence/build-${{ matrix.row }}.json
          --artifact-id "${{ steps.wheel-upload.outputs.artifact-id }}"
          --artifact-digest "${{ steps.wheel-upload.outputs.artifact-digest }}"
          --compiler candidate/native-validation-evidence/compiler-${{ matrix.row }}.json
          --native-inspection candidate/native-validation-evidence/native-inspection-${{ matrix.row }}.txt
          --builder candidate/native-validation-evidence/builder-${{ matrix.row }}.txt

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-validation-evidence-build-${{ matrix.row }}-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: candidate/native-validation-evidence/*
          if-no-files-found: error
          retention-days: 7

  consume-full:
    needs: [preflight, build-linux, build-host]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { row: linux-x86_64, runner: ubuntu-22.04, python: '3.10', uv: 'false' }
          - { row: linux-x86_64, runner: ubuntu-22.04, python: '3.13', uv: 'false' }
          - { row: linux-aarch64, runner: ubuntu-24.04-arm, python: '3.10', uv: 'false' }
          - { row: linux-aarch64, runner: ubuntu-24.04-arm, python: '3.13', uv: 'false' }
          - { row: windows-x64, runner: windows-latest, python: '3.10', uv: 'false' }
          - { row: windows-x64, runner: windows-latest, python: '3.13', uv: 'false' }
          - { row: macos-x86_64, runner: macos-15-intel, python: '3.10', uv: 'false' }
          - { row: macos-x86_64, runner: macos-15-intel, python: '3.13', uv: 'false' }
          - { row: macos-aarch64, runner: macos-latest, python: '3.10', uv: 'true' }
          - { row: macos-aarch64, runner: macos-latest, python: '3.13', uv: 'false' }
    steps:
      - name: Check out reviewed validation driver
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: driver
          persist-credentials: false

      - name: Check out frozen candidate tests and licenses
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false

      - name: Verify exact driver and frozen candidate source
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python3 -I -B driver/scripts/native-wheel-validation.py verify-driver --driver driver --workflow-sha "$WORKFLOW_SHA"
          python3 -I -B driver/scripts/native-wheel-validation.py verify-source --candidate candidate

      - name: Download exact same-run wheel artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-validation-wheel-${{ matrix.row }}-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-wheelhouse

      - name: Set up CPython from actions manifest
        if: matrix.uv == 'false'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Set up pinned uv for macOS ARM64 CPython 3.10
        if: matrix.uv == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7 peeled commit
        with:
          version: 0.12.10
          checksum: 51c6170e8e3a01cef9f33b94f582b7b81ac65046f55d40afb35f9cff5a68c179
          enable-cache: false

      - name: Audit, install, smoke, and run all candidate Python tests
        shell: bash
        env:
          USE_UV: ${{ matrix.uv }}
          EXPECTED_PYTHON: ${{ matrix.python }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          UV_EXPECTED_DOWNLOAD_SHA256: c2ddcefee6ae51286001dc22320434676adcc89362330823b409eac51a101a4b
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-consumer-evidence"
          consumer_id="${{ matrix.row }}-py${{ matrix.python }}"
          provisioning="$RUNNER_TEMP/native-consumer-evidence/python-provisioning-$consumer_id.txt"
          python_cmd="python"
          if [[ "$USE_UV" == "true" ]]; then
            test "$(uv self version --short)" = "0.12.10"
            uv python install 3.10.21
            python_cmd="$(uv python find --managed-python 3.10.21)"
            "$python_cmd" -I - <<'PY'
          import platform, sys
          assert sys.implementation.name == "cpython"
          assert sys.version_info[:3] == (3, 10, 21)
          assert platform.machine() == "arm64"
          PY
            uv python dir
            {
              uv --version
              printf 'python-build-standalone=20260901 stripped-asset-sha256=%s\n' "$UV_EXPECTED_DOWNLOAD_SHA256"
              printf 'python=%s\n' "$python_cmd"
            } > "$provisioning"
          else
            "$python_cmd" -I -c 'import platform,sys; print(sys.version); print(platform.platform()); print(platform.machine())' > "$provisioning"
          fi
          "$python_cmd" -I -B driver/scripts/native-wheel-validation.py consume-full \
            --wheelhouse "$RUNNER_TEMP/native-wheelhouse" --candidate candidate --driver driver \
            --work "$RUNNER_TEMP/native-consumer-work" --row "${{ matrix.row }}" \
            --consumer-row "${{ matrix.row }}-py${{ matrix.python }}" \
            --python-version "$EXPECTED_PYTHON" --workflow-sha "$WORKFLOW_SHA" \
            --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" \
            --provisioning "$provisioning" \
            --output "$RUNNER_TEMP/native-consumer-evidence/consumer-${{ matrix.row }}-py${{ matrix.python }}.json"

      - name: Upload full-suite consumer evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-validation-evidence-consumer-${{ matrix.row }}-py${{ matrix.python }}-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-consumer-evidence/*
          if-no-files-found: error
          retention-days: 7

  consume-musl:
    needs: [preflight, build-linux, build-host]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { row: musllinux-x86_64, runner: ubuntu-22.04, python: '3.10', interpreter: /opt/python/cp310-cp310/bin/python, image: 'quay.io/pypa/musllinux_1_2_x86_64@sha256:621f8004ed526a5a6bf6a866fb415ad8da54d59a991e50b3b69167c3a768a616' }
          - { row: musllinux-x86_64, runner: ubuntu-22.04, python: '3.13', interpreter: /opt/python/cp313-cp313/bin/python, image: 'quay.io/pypa/musllinux_1_2_x86_64@sha256:621f8004ed526a5a6bf6a866fb415ad8da54d59a991e50b3b69167c3a768a616' }
          - { row: musllinux-aarch64, runner: ubuntu-24.04-arm, python: '3.10', interpreter: /opt/python/cp310-cp310/bin/python, image: 'quay.io/pypa/musllinux_1_2_aarch64@sha256:4dffcd49f0b6fc6928a49915f3cd939f973bbecbdfe96e1e7926b6049bc0bad5' }
          - { row: musllinux-aarch64, runner: ubuntu-24.04-arm, python: '3.13', interpreter: /opt/python/cp313-cp313/bin/python, image: 'quay.io/pypa/musllinux_1_2_aarch64@sha256:4dffcd49f0b6fc6928a49915f3cd939f973bbecbdfe96e1e7926b6049bc0bad5' }
    steps:
      - name: Check out reviewed validation driver
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: driver
          persist-credentials: false

      - name: Check out frozen candidate licenses
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false

      - name: Verify driver and candidate, then stage only helper plus canonical licenses
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          python3 -I -B driver/scripts/native-wheel-validation.py verify-driver --driver driver --workflow-sha "$WORKFLOW_SHA"
          python3 -I -B driver/scripts/native-wheel-validation.py verify-source --candidate candidate
          mkdir -p "$RUNNER_TEMP/musl-validation" "$RUNNER_TEMP/musl-licenses" "$RUNNER_TEMP/musl-results"
          cp driver/scripts/native-wheel-validation.py "$RUNNER_TEMP/musl-validation/"
          cp candidate/LICENSE-MIT candidate/LICENSE-APACHE "$RUNNER_TEMP/musl-licenses/"

      - name: Download exact same-run musl wheel artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-validation-wheel-${{ matrix.row }}-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/musl-wheelhouse

      - name: Run bounded smoke offline in native pinned musllinux image
        shell: bash
        env:
          MUSL_IMAGE: ${{ matrix.image }}
          MUSL_PYTHON: ${{ matrix.interpreter }}
        run: |
          set -euo pipefail
          docker pull "$MUSL_IMAGE"
          digest="${MUSL_IMAGE##*@}"
          docker image inspect --format '{{json .RepoDigests}} image_id={{.Id}}' "$MUSL_IMAGE" | tee "$RUNNER_TEMP/musl-results/container-${{ matrix.row }}-py${{ matrix.python }}.txt" | grep -F "$digest"
          docker run --rm --network none --tmpfs /tmp:rw \
            --mount "type=bind,src=$RUNNER_TEMP/musl-wheelhouse,dst=/wheelhouse,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/musl-validation,dst=/validation,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/musl-licenses,dst=/licenses,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/musl-results,dst=/results" \
            "$MUSL_IMAGE" "$MUSL_PYTHON" -I -B /validation/native-wheel-validation.py consume-musl \
            --wheelhouse /wheelhouse --licenses /licenses --work /tmp/native-consumer \
            --row "${{ matrix.row }}" --consumer-row "${{ matrix.row }}-py${{ matrix.python }}" \
            --python-version "${{ matrix.python }}" \
            --output "/results/smoke-${{ matrix.row }}-py${{ matrix.python }}.json"

      - name: Bind container provenance into consumer report
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          MUSL_IMAGE: ${{ matrix.image }}
        run: >-
          python3 -I -B driver/scripts/native-wheel-validation.py wrap-musl
          --smoke-report "$RUNNER_TEMP/musl-results/smoke-${{ matrix.row }}-py${{ matrix.python }}.json"
          --row "${{ matrix.row }}" --consumer-row "${{ matrix.row }}-py${{ matrix.python }}"
          --workflow-sha "$WORKFLOW_SHA" --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}" --container-image "$MUSL_IMAGE"
          --container-digest "${MUSL_IMAGE##*@}"
          --container-evidence "$RUNNER_TEMP/musl-results/container-${{ matrix.row }}-py${{ matrix.python }}.txt"
          --output "$RUNNER_TEMP/musl-results/consumer-${{ matrix.row }}-py${{ matrix.python }}.json"

      - name: Upload bounded musl consumer evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-validation-evidence-consumer-${{ matrix.row }}-py${{ matrix.python }}-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/musl-results/*
          if-no-files-found: error
          retention-days: 7

  complete:
    if: always()
    needs: [preflight, build-linux, build-host, consume-full, consume-musl]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed validation driver
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: driver
          persist-credentials: false

      - name: Verify exact reviewed driver checkout
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python3 -I -B driver/scripts/native-wheel-validation.py verify-driver --driver driver --workflow-sha "$WORKFLOW_SHA"

      - name: Download same-run evidence artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: native-validation-evidence-*-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-evidence

      - name: Require successful jobs and complete hashed evidence inventory
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          NEEDS_RESULTS: >-
            {"preflight":"${{ needs.preflight.result }}","build-linux":"${{ needs.build-linux.result }}","build-host":"${{ needs.build-host.result }}","consume-full":"${{ needs.consume-full.result }}","consume-musl":"${{ needs.consume-musl.result }}"}
        run: >-
          python3 -I -B driver/scripts/native-wheel-validation.py aggregate
          --evidence "$RUNNER_TEMP/native-evidence" --workflow-sha "$WORKFLOW_SHA"
          --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}"
          --needs-results "$NEEDS_RESULTS"
          --output "$RUNNER_TEMP/native-validation-summary.json"

      - name: Upload final inventory
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-validation-inventory-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-validation-summary.json
          if-no-files-found: error
          retention-days: 7
